<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Lab — Galáxia</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#020208;color:#E2E8F0;font-family:system-ui,-apple-system,sans-serif;cursor:crosshair}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;display:flex;height:100vh}
.gal{flex:0 0 63%;position:relative;overflow:hidden}
.gal svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#pl{position:absolute;inset:0}
.pw{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:10}
.pb{border-radius:50%;position:relative;transition:transform .3s,box-shadow .4s}
.pw:hover .pb{transform:scale(1.25)!important}
.pring{position:absolute;top:50%;left:50%;border-radius:50%;border:2px solid;transform:translate(-50%,-50%) scaleY(0.22);pointer-events:none}
.pname{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);font-size:8px;white-space:nowrap;letter-spacing:.8px;text-transform:uppercase;pointer-events:none;opacity:.65}
.chat{flex:1;display:flex;flex-direction:column;background:rgba(3,5,18,.92);border-left:1px solid rgba(80,100,200,.18);backdrop-filter:blur(30px)}
.hud{padding:13px 15px;background:rgba(255,255,255,.02);border-bottom:1px solid rgba(80,100,200,.15);display:flex;gap:11px;align-items:center;flex-shrink:0}
.hud-pl{width:32px;height:32px;border-radius:50%;flex-shrink:0}
.hud-lbl{font-size:13px;font-weight:600}
.hud-dsc{font-size:10.5px;color:#475569;margin-top:2px}
.hud-mode{margin-left:auto;font-size:10px;padding:3px 10px;border-radius:20px;border:1px solid;flex-shrink:0}
.logw{background:rgba(0,0,0,.2);border-bottom:1px solid rgba(80,100,200,.15);overflow:hidden;transition:max-height .25s;flex-shrink:0}
.logh{padding:7px 14px;font-size:11px;color:#475569;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.logh:hover{color:#94A3B8}
.logl{padding:0 14px 8px;max-height:108px;overflow-y:auto}
.li{font-size:10px;padding:2px 0;display:flex;gap:6px;align-items:flex-start}
.lic{flex-shrink:0;font-size:9px;margin-top:1px}
.lit{color:#475569;flex:1}
.lim{color:#1E293B;font-size:9px;flex-shrink:0}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:rgba(80,100,200,.2) transparent}
.empty{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.ei{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.18)}
.et{font-size:12px;color:#94A3B8;font-weight:500}
.es{font-size:10.5px;color:#334155}
.qbs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.qb{font-size:10.5px;padding:5px 11px;border-radius:20px;cursor:pointer;border:1px solid;background:transparent;transition:opacity .2s,transform .1s;color:inherit}
.qb:hover{opacity:.7;transform:scale(.97)}
.msg{display:flex;gap:8px}
.msg.user{flex-direction:row-reverse}
.mav{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:2px;font-weight:700}
.mbod{display:flex;flex-direction:column;max-width:86%}
.msg.user .mbod{align-items:flex-end}
.mfrom{font-size:9.5px;font-weight:600;margin-bottom:3px;padding:0 2px}
.mbub{padding:8px 13px;border-radius:14px;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user .mbub{background:#2563EB;color:#fff;border-top-right-radius:3px}
.msg.bot .mbub{background:rgba(255,255,255,.04);border:1px solid rgba(80,100,200,.2);color:#CBD5E1;border-top-left-radius:3px}
.cur{display:inline-block;width:2px;height:12px;background:#60A5FA;margin-left:2px;vertical-align:middle;animation:blink .8s step-end infinite}
.inpb{padding:10px 12px;background:rgba(255,255,255,.02);border-top:1px solid rgba(80,100,200,.15);display:flex;gap:8px;align-items:center;flex-shrink:0}
.inpb input{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(80,100,200,.2);border-radius:10px;padding:8px 13px;font-size:12.5px;color:#E2E8F0;outline:none;transition:border-color .2s}
.inpb input:focus{border-color:rgba(96,165,250,.5)}
.inpb input::placeholder{color:#1E293B}
.sbtn{width:34px;height:34px;border-radius:9px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;transition:opacity .2s,transform .1s;flex-shrink:0}
.sbtn:hover{opacity:.82;transform:scale(.95)}
.sbtn:disabled{opacity:.25;cursor:default;transform:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(80,100,200,.2);border-radius:3px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="app">
  <div class="gal" id="gal">
    <svg id="oSvg"></svg>
    <div id="pl"></div>
  </div>
  <div class="chat">
    <div class="hud">
      <div class="hud-pl" id="hPl"></div>
      <div><div class="hud-lbl" id="hLbl">Orquestrador</div><div class="hud-dsc" id="hDsc">Roteador inteligente</div></div>
      <div class="hud-mode" id="hMode">Auto-roteamento</div>
    </div>
    <div class="logw" id="logw" style="max-height:140px">
      <div class="logh" onclick="toggleLog()">
        <span>◉ Atividade <span id="lcnt" style="background:rgba(80,100,200,.15);border-radius:20px;padding:1px 7px;font-size:9px;margin-left:4px;color:#94A3B8">0</span></span>
        <span id="lchev">▾</span>
      </div>
      <div class="logl" id="logl"><div class="li"><span class="lic" style="color:#1E293B">·</span><span class="lit" style="color:#1E293B">Nenhuma atividade — inicie uma conversa.</span></div></div>
    </div>
    <div class="msgs" id="msgs">
      <div class="empty" id="emp">
        <div class="ei">🌌</div>
        <div><p class="et">Clique em um planeta para começar</p><p class="es">Ou use os atalhos abaixo</p></div>
        <div class="qbs" id="qbs"></div>
      </div>
    </div>
    <div class="inpb">
      <input id="inp" type="text" placeholder="Falar com Orquestrador…"/>
      <button class="sbtn" id="sbtn" onclick="send()">➤</button>
    </div>
  </div>
</div>
<script>
const A={
  orchestrator:{label:'Orquestrador',desc:'Roteador inteligente — distribui para o agente certo',color:'#FFD700',size:50,orbit:0,speed:0,phase:0,bg:'radial-gradient(circle at 33% 28%, #FFFDE7, #FFD700 45%, #E65100 85%)'},
  agenda:      {label:'Agenda',     desc:'Tarefas, KPIs do dia e produtividade',           color:'#14B8A6',size:18,orbit:.115,speed:.00125,phase:.5,  bg:'radial-gradient(circle at 33% 28%, #5EEAD4, #14B8A6 50%, #065F54)'},
  feedback:    {label:'Coach 1:1',  desc:'Feedback pessoal e análise de desempenho',        color:'#A855F7',size:24,orbit:.178,speed:.00088,phase:1.2, bg:'radial-gradient(circle at 33% 28%, #EDE9FE, #A855F7 45%, #581C87)',ring:true},
  deal:        {label:'Deal Intel', desc:'Health score e análise cirúrgica de negócios',    color:'#F97316',size:28,orbit:.245,speed:.00072,phase:2.4, bg:'radial-gradient(circle at 33% 28%, #FED7AA, #F97316 45%, #7C2D12)'},
  postsales:   {label:'Pós-Vendas', desc:'Churn risk, upsell e reativação de clientes',     color:'#EC4899',size:20,orbit:.308,speed:.00057,phase:.8,  bg:'radial-gradient(circle at 33% 28%, #FCE7F3, #EC4899 45%, #831843)'},
  carteira:    {label:'Carteira',   desc:'Portfólio de clientes e priorização',             color:'#22C55E',size:26,orbit:.372,speed:.00046,phase:3.8, bg:'radial-gradient(circle at 33% 28%, #DCFCE7, #22C55E 45%, #14532D)'},
  gamification:{label:'Gamificação',desc:'Rankings, XP, conquistas e motivação',            color:'#EAB308',size:22,orbit:.432,speed:.00039,phase:5.2, bg:'radial-gradient(circle at 33% 28%, #FEF9C3, #EAB308 45%, #713F12)',ring:true},
  inactivity:  {label:'Monitor',    desc:'Alertas automáticos de inatividade',              color:'#EF4444',size:19,orbit:.49, speed:.00033,phase:1.6, bg:'radial-gradient(circle at 33% 28%, #FEE2E2, #EF4444 45%, #7F1D1D)'},
  manager:     {label:'Gestão',     desc:'Dashboard gerencial e forecast da equipe',        color:'#60A5FA',size:32,orbit:.545,speed:.00026,phase:4.5, bg:'radial-gradient(circle at 33% 28%, #DBEAFE, #60A5FA 45%, #1E3A8A)',ring:true},
};
const SPOKES=['agenda','feedback','deal','postsales','carteira','gamification','inactivity','manager'];
let sel='orchestrator',streaming=false,logOpen=true,logCnt=0,msgN=0;
let mx=.5,my=.5,GW=0,GH=0,CX=0,CY=0;
let ang={};SPOKES.forEach(k=>ang[k]=A[k].phase);

// ── CANVAS STARFIELD ──
const cv=document.getElementById('bg'),ctx=cv.getContext('2d');
let stars=[];
const nebulae=[{x:.18,y:.28,rr:.32,c:'#1A0840',d:.12},{x:.78,y:.72,rr:.26,c:'#001840',d:.09},{x:.55,y:.1,rr:.22,c:'#400010',d:.13},{x:.1,y:.78,rr:.24,c:'#003820',d:.08}];

function initStars(){
  cv.width=innerWidth;cv.height=innerHeight;stars=[];
  const add=(n,rMin,rMax,opMin,opMax,dMin,dMax)=>{for(let i=0;i<n;i++)stars.push({x:Math.random(),y:Math.random(),r:rMin+Math.random()*(rMax-rMin),op:opMin+Math.random()*(opMax-opMin),d:dMin+Math.random()*(dMax-dMin),tw:Math.random()*Math.PI*2,ts:.0003+Math.random()*.002,col:Math.random()>.1?'#fff':(Math.random()>.5?'#C8DEFF':'#FFE8C8')})};
  add(280,.2,.7,.2,.55,0,.3);add(90,.7,1.5,.4,.85,.2,.55);add(22,1.5,2.5,.6,1.0,.5,.9);
}

function drawBg(t){
  const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.85);
  g.addColorStop(0,'#08091A');g.addColorStop(.5,'#030510');g.addColorStop(1,'#010206');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  nebulae.forEach(n=>{
    const px=n.x*W+(mx-.5)*n.d*90,py=n.y*H+(my-.5)*n.d*65,rw=n.rr*Math.max(W,H);
    const ng=ctx.createRadialGradient(px,py,0,px,py,rw);
    ng.addColorStop(0,n.c+'22');ng.addColorStop(.5,n.c+'0D');ng.addColorStop(1,'transparent');
    ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);
  });
  stars.forEach(s=>{
    const tw=Math.sin(s.tw+t*s.ts)*.5+.5;
    ctx.globalAlpha=s.op*(.5+tw*.5);ctx.fillStyle=s.col;
    ctx.beginPath();ctx.arc(s.x*W+(mx-.5)*s.d*65,s.y*H+(my-.5)*s.d*45,s.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

// ── SVG ORBITS ──
const svg=document.getElementById('oSvg');
function buildOrbits(){
  svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${GW} ${GH}`);
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  SPOKES.forEach(k=>{
    const lg=document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
    lg.id=`lg-${k}`;lg.setAttribute('gradientUnits','userSpaceOnUse');
    [{o:'0%',c:'#FFD700',a:'.9'},{o:'100%',c:A[k].color,a:'.7'}].forEach(s=>{
      const st=document.createElementNS('http://www.w3.org/2000/svg','stop');
      st.setAttribute('offset',s.o);st.setAttribute('stop-color',s.c);st.setAttribute('stop-opacity',s.a);lg.appendChild(st);
    });
    defs.appendChild(lg);
  });
  svg.appendChild(defs);
  SPOKES.forEach(k=>{
    const r=A[k].orbit*Math.min(GW,GH);
    const el=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    el.id=`oe-${k}`;el.setAttribute('cx',CX);el.setAttribute('cy',CY);
    el.setAttribute('rx',r);el.setAttribute('ry',r*.44);
    el.setAttribute('fill','none');el.setAttribute('stroke',A[k].color);
    el.setAttribute('stroke-opacity','.07');el.setAttribute('stroke-width','1');el.setAttribute('stroke-dasharray','3 9');
    svg.appendChild(el);
  });
  SPOKES.forEach(k=>{
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.id=`cl-${k}`;ln.setAttribute('x1',CX);ln.setAttribute('y1',CY);ln.setAttribute('x2',CX);ln.setAttribute('y2',CY);
    ln.setAttribute('stroke',`url(#lg-${k})`);ln.setAttribute('stroke-opacity','0');ln.setAttribute('stroke-width','1.5');
    svg.appendChild(ln);
    for(let i=2;i>=0;i--){
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.id=`ct-${k}-${i}`;c.setAttribute('r',3-i*.6);c.setAttribute('fill',A[k].color);c.setAttribute('opacity','0');svg.appendChild(c);
    }
  });
}

// ── PLANETS ──
const plEl=document.getElementById('pl');
function buildPlanets(){
  plEl.innerHTML='';
  const sw=document.createElement('div');
  sw.id='sw';sw.style.cssText=`position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:20`;sw.onclick=()=>selectAgent('orchestrator');
  const sb=document.createElement('div');
  sb.style.cssText=`width:50px;height:50px;border-radius:50%;background:${A.orchestrator.bg};box-shadow:0 0 20px #FFD70080,0 0 45px #FFD70045,0 0 90px #FFD70020;animation:pulse 3s ease-in-out infinite;position:relative;display:flex;align-items:center;justify-content:center;font-size:20px`;
  sb.textContent='☀';
  [28,52,76].forEach((ex,i)=>{
    const c=document.createElement('div');
    c.style.cssText=`position:absolute;width:${50+ex}px;height:${50+ex}px;border-radius:50%;border:1px solid rgba(255,215,0,${.22-i*.06});top:50%;left:50%;transform:translate(-50%,-50%);animation:pulse ${3.4+i*.6}s ease-in-out ${i*.4}s infinite;pointer-events:none`;
    sb.appendChild(c);
  });
  const sl=document.createElement('div');
  sl.style.cssText=`position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);font-size:8px;white-space:nowrap;color:rgba(255,215,0,.55);letter-spacing:.8px;text-transform:uppercase;pointer-events:none`;
  sl.textContent='Orquestrador';
  sw.appendChild(sb);sw.appendChild(sl);plEl.appendChild(sw);
  SPOKES.forEach(k=>{
    const cfg=A[k],w=document.createElement('div');
    w.id=`pw-${k}`;w.className='pw';w.onclick=()=>selectAgent(k);
    const b=document.createElement('div');
    b.id=`pb-${k}`;b.className='pb';
    b.style.cssText=`width:${cfg.size}px;height:${cfg.size}px;background:${cfg.bg};box-shadow:0 0 ${cfg.size/2}px ${cfg.color}60,0 0 ${cfg.size}px ${cfg.color}30`;
    if(cfg.ring){const r=document.createElement('div');r.className='pring';r.style.cssText=`width:${cfg.size*1.85}px;height:${cfg.size*1.85}px;border-color:${cfg.color}55;top:50%;left:50%;`;b.appendChild(r);}
    const nm=document.createElement('div');nm.className='pname';nm.style.color=cfg.color;nm.textContent=cfg.label;
    w.appendChild(b);w.appendChild(nm);plEl.appendChild(w);
  });
  updateHUD('orchestrator');
}

// ── SELECT ──
function selectAgent(k){
  sel=k;const cfg=A[k];
  SPOKES.forEach(id=>{const b=document.getElementById(`pb-${id}`);if(b){b.style.transform='';b.style.boxShadow=`0 0 ${A[id].size/2}px ${A[id].color}60,0 0 ${A[id].size}px ${A[id].color}30`}});
  if(k!=='orchestrator'){const b=document.getElementById(`pb-${k}`);if(b){b.style.transform='scale(1.18)';b.style.boxShadow=`0 0 ${cfg.size}px ${cfg.color}CC,0 0 ${cfg.size*2}px ${cfg.color}70,0 0 ${cfg.size*3.5}px ${cfg.color}30`}}
  updateHUD(k);
  document.getElementById('inp').placeholder=`Falar com ${cfg.label}…`;
  document.getElementById('sbtn').style.background=cfg.color;
}

function updateHUD(k){
  const cfg=A[k],hp=document.getElementById('hPl');
  hp.style.cssText=`width:32px;height:32px;border-radius:50%;background:${cfg.bg};box-shadow:0 0 12px ${cfg.color}60;flex-shrink:0`;
  const hl=document.getElementById('hLbl');hl.textContent=cfg.label;hl.style.color=cfg.color;
  document.getElementById('hDsc').textContent=cfg.desc;
  const hm=document.getElementById('hMode');
  hm.textContent=k==='orchestrator'?'Auto-roteamento':'Direto';
  hm.style.cssText=`margin-left:auto;font-size:10px;padding:3px 10px;border-radius:20px;border:1px solid ${cfg.color}45;color:${cfg.color};background:${cfg.color}15;flex-shrink:0`;
}

// ── CONNECTION ──
let cInt={};
function setConn(k,on){
  if(!k||k==='orchestrator')return;
  const cfg=A[k],ln=document.getElementById(`cl-${k}`);
  if(on){
    if(ln)ln.setAttribute('stroke-opacity','.65');
    let t=0;if(cInt[k])clearInterval(cInt[k]);
    cInt[k]=setInterval(()=>{
      t=(t+.035)%1;const p=getPPos(k);
      if(ln){ln.setAttribute('x2',p.x);ln.setAttribute('y2',p.y);}
      for(let i=0;i<3;i++){const tt=Math.max(0,t-i*.06),c=document.getElementById(`ct-${k}-${i}`);if(c){c.setAttribute('cx',CX+(p.x-CX)*tt);c.setAttribute('cy',CY+(p.y-CY)*tt);c.setAttribute('opacity',(1-i*.28).toString());}}
    },22);
    const b=document.getElementById(`pb-${k}`);if(b)b.style.boxShadow=`0 0 ${cfg.size*1.5}px ${cfg.color}EE,0 0 ${cfg.size*3}px ${cfg.color}80,0 0 ${cfg.size*5}px ${cfg.color}40`;
  } else {
    if(ln)ln.setAttribute('stroke-opacity','0');
    for(let i=0;i<3;i++){const c=document.getElementById(`ct-${k}-${i}`);if(c)c.setAttribute('opacity','0');}
    if(cInt[k]){clearInterval(cInt[k]);delete cInt[k];}
    const b=document.getElementById(`pb-${k}`);
    if(b)b.style.boxShadow=k===sel?`0 0 ${cfg.size}px ${cfg.color}CC,0 0 ${cfg.size*2}px ${cfg.color}70`:`0 0 ${cfg.size/2}px ${cfg.color}60,0 0 ${cfg.size}px ${cfg.color}30`;
  }
}

function getPPos(k){
  const r=A[k].orbit*Math.min(GW,GH);
  return{x:CX+r*Math.cos(ang[k])+(mx-.5)*8,y:CY+r*.44*Math.sin(ang[k])+(my-.5)*5};
}

// ── LOG ──
const LI={user:'↑',routing:'⟳',routed:'→',tool_call:'⚙',tool_result:'✓',delta:'▸',done:'●',error:'✗'};
const LC={user:'#60A5FA',routing:'#A855F7',routed:'#22C55E',tool_call:'#F97316',tool_result:'#22C55E',delta:'#334155',done:'#14B8A6',error:'#EF4444'};
function addLog(type,text,k){
  const cfg=k?A[k]:null,t=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const d=document.createElement('div');d.className='li';
  d.innerHTML=`<span class="lic" style="color:${LC[type]||'#334155'}">${LI[type]||'·'}</span><span class="lit">${cfg?`<span style="color:${cfg.color};font-weight:600">[${cfg.label}] </span>`:''}${text}</span><span class="lim">${t}</span>`;
  const ll=document.getElementById('logl');
  if(ll.firstChild?.textContent?.includes('Nenhuma'))ll.innerHTML='';
  ll.insertBefore(d,ll.firstChild);if(ll.children.length>30)ll.removeChild(ll.lastChild);
  document.getElementById('lcnt').textContent=++logCnt;
}
function toggleLog(){logOpen=!logOpen;document.getElementById('logw').style.maxHeight=logOpen?'140px':'32px';document.getElementById('lchev').textContent=logOpen?'▾':'▸';}

// ── MESSAGES ──
function addMsg(role,content,k,isStr){
  document.getElementById('emp')?.remove();
  const id=`m-${++msgN}`,cfg=k?A[k]:A.orchestrator,msgs=document.getElementById('msgs');
  const d=document.createElement('div');d.id=id;d.className=`msg ${role==='user'?'user':'bot'}`;
  if(role!=='user'){d.innerHTML=`<div class="mav" style="background:${cfg.color}25;border:1px solid ${cfg.color}40;color:${cfg.color}">${cfg.label[0]}</div><div class="mbod"><div class="mfrom" style="color:${cfg.color}">${cfg.label}</div><div class="mbub">${isStr?'<span class="cur"></span>':esc(content)}</div></div>`;}
  else{d.innerHTML=`<div class="mbod"><div class="mbub">${esc(content)}</div></div>`;}
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return id;
}
function updMsg(id,content,isStr){
  const el=document.getElementById(id);if(!el)return;
  const b=el.querySelector('.mbub');if(!b)return;
  b.innerHTML=esc(content)+(isStr?'<span class="cur"></span>':'');
  document.getElementById('msgs').scrollTop=document.getElementById('msgs').scrollHeight;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}

// ── RESPONSES ──
const RESP={

function route(msg){
  const m=msg.toLowerCase();
  if(/deal|negócio|score|saúde/.test(m))return'deal';
  if(/churn|pós|upsell|reter/.test(m))return'postsales';
  if(/agenda|tarefa|kpi|hoje/.test(m))return'agenda';
  if(/carteira|portfólio|cliente/.test(m))return'carteira';
  if(/ranking|ponto|xp|gamif/.test(m))return'gamification';
  if(/equipe|team|forecast|gestor/.test(m))return'manager';
  if(/inativ|alerta|parado/.test(m))return'inactivity';
  return'feedback';
}

// ── SEND ──
function send(){
  const inp=document.getElementById('inp'),text=inp.value.trim();
  if(!text||streaming)return;inp.value='';streaming=true;
  document.getElementById('sbtn').disabled=true;
  addMsg('user',text,null,false);addLog('user',`Para ${A[sel].label}`);
  const isOrch=sel==='orchestrator',target=isOrch?route(text):sel;
  const tools=TOOLS[target]||TOOLS.feedback,maxD=tools.length?Math.max(...tools.map(t=>t.d)):500;
  let mId;
  if(isOrch){
    addLog('routing','Orquestrador classificando…','orchestrator');
    setTimeout(()=>{addLog('routed',`Roteado → ${A[target].label}`,target);selectAgent(target);setConn(target,true);mId=addMsg('bot','',target,true);runTools(tools,target,mId,RESP[target]||RESP.feedback,maxD);},500);
  } else {setConn(target,true);mId=addMsg('bot','',target,true);runTools(tools,target,mId,RESP[target]||RESP.feedback,maxD);}
}
function runTools(tools,agent,mId,resp,maxD){
  tools.forEach(t=>setTimeout(()=>addLog(t.t,t.tx,agent),t.d));
  setTimeout(()=>{addLog('delta','Gerando resposta…',agent);stream(mId,resp,0,agent);},maxD+400);
}
function stream(mId,text,i,agent){
  const next=Math.min(i+Math.floor(Math.random()*4)+1,text.length);
  updMsg(mId,text.slice(0,next),next<text.length);
  if(next<text.length)setTimeout(()=>stream(mId,text,next,agent),Math.random()*14+7);
  else{streaming=false;document.getElementById('sbtn').disabled=false;setConn(agent,false);addLog('done','Resposta concluída',agent);}
}

// ── RESIZE + LOOP ──
function resize(){
  cv.width=innerWidth;cv.height=innerHeight;
  const g=document.getElementById('gal');GW=g.offsetWidth;GH=g.offsetHeight;CX=GW*.5;CY=GH*.5;
  const sw=document.getElementById('sw');if(sw){sw.style.left=CX+'px';sw.style.top=CY+'px';}
  buildOrbits();initStars();
}
function loop(t){
  requestAnimationFrame(loop);drawBg(t);if(!GW)return;
  SPOKES.forEach(k=>{ang[k]+=A[k].speed;const p=getPPos(k),el=document.getElementById(`pw-${k}`);if(el){el.style.left=p.x+'px';el.style.top=p.y+'px';}});
  const sw=document.getElementById('sw');if(sw){sw.style.left=CX+(mx-.5)*9+'px';sw.style.top=CY+(my-.5)*6+'px';}
  SPOKES.forEach(k=>{const oe=document.getElementById(`oe-${k}`);if(oe){oe.setAttribute('cx',CX+(mx-.5)*5);oe.setAttribute('cy',CY+(my-.5)*3);}});
}
document.addEventListener('mousemove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight;});
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
window.addEventListener('resize',resize);
initStars();setTimeout(()=>{resize();buildPlanets();requestAnimationFrame(loop);},50);
</script>
